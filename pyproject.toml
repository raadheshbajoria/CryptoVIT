[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptovit"
version = "0.2.0"
description = "Chaos-assisted Vision Transformer for privacy-preserving classification of encrypted medical images"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "omegaconf>=2.3",
    "numpy>=1.24",
    "pillow>=9.0",
    "scikit-learn>=1.3",
    "tqdm>=4.65",
    "einops>=0.7",
    "medmnist>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "ruff>=0.4",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]
dashboard = [
    "streamlit>=1.32",
    "requests>=2.31",
    "pandas>=2.0",
    "altair>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["experiments", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B905"]

[tool.ruff.lint.per-file-ignores]
"api/main.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["cryptovit", "api"]
